name: Build & Deploy Catalog

on:
  push:
    branches: [main]
    paths:
      - 'data/source/**'
      - 'data/config/**'
      - 'data/spa/**'
      - 'src/build/**'
      - 'src/schema/**'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual trigger'

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build catalog
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: npm run build

      - name: Stage deploy payload
        run: |
          mkdir -p site
          # Catalog output
          cp data/index.json site/
          cp -r data/products site/
          cp -r data/batches site/
          cp -r data/config site/
          cp data/.version site/
          # Storefront
          [ -f data/index.html ]       && cp data/index.html site/index.html
          [ -f data/store-config.js ]  && cp data/store-config.js site/store-config.js
          [ -d data/lib ]              && cp -r data/lib site/lib
          [ -d data/spa ]              && cp -r data/spa site/spa

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catalog-build
          path: site/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: catalog-build
          path: ./deploy

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./deploy --project-name=${{ secrets.PAGES_PROJECT_NAME }} --branch=main

      - name: Purge CDN cache
        if: ${{ secrets.CLOUDFLARE_ZONE_ID != '' }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify on failure
        if: needs.deploy.result == 'failure'
        run: echo "::error::Build or deploy failed! Check logs above."
