name: Build & Deploy Catalog

on:
  push:
    branches: [main]
    paths:
      - 'data/source/**'
      - 'data/config/**'
      - 'data/spa/**'
      - 'src/build/**'
      - 'src/schema/**'
      - 'src/api/**'
      - 'wrangler.toml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual trigger'

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build catalog
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: npm run build

      - name: Stage deploy payload
        run: |
          mkdir -p site
          # Catalog output (guard each — build step creates these but only if data exists)
          [ -f data/index.json ]       && cp data/index.json site/
          [ -d data/products ]         && cp -r data/products site/
          [ -d data/batches ]          && cp -r data/batches site/
          [ -d data/config ]           && cp -r data/config site/
          [ -f data/.version ]         && cp data/.version site/
          # Storefront
          [ -f data/index.html ]       && cp data/index.html site/index.html
          [ -f data/admin.html ]       && cp data/admin.html site/admin.html
          [ -f data/store-config.js ]  && cp data/store-config.js site/store-config.js
          [ -d data/lib ]              && cp -r data/lib site/lib
          [ -d data/spa ]              && cp -r data/spa site/spa
          # Ensure at least one file exists so the artifact upload doesn't fail
          ls site/ || (echo "No files staged" && exit 1)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catalog-build
          path: site/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: catalog-build
          path: ./deploy

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./deploy --project-name=${{ secrets.PAGES_PROJECT_NAME }} --branch=main

      - name: Purge CDN cache
        if: ${{ env.CLOUDFLARE_ZONE_ID != '' }}
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

  deploy-api:
    runs-on: ubuntu-latest
    # Only runs when src/api or wrangler.toml actually changed, or on
    # workflow_dispatch (manual trigger). Skipped on scheduled runs and
    # when only catalog/config files changed — no need to redeploy the
    # Worker for a product update.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        contains(toJson(github.event.commits.*.modified), 'src/api/') ||
        contains(toJson(github.event.commits.*.added), 'src/api/') ||
        contains(toJson(github.event.commits.*.modified), 'wrangler.toml')
      ))

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy src/api/index.js

  notify:
    needs: [deploy, deploy-api]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify on failure
        if: needs.deploy.result == 'failure' || needs.deploy-api.result == 'failure'
        run: echo "::error::Build or deploy failed! Check logs above."
