name: Build & Deploy Catalog

on:
  push:
    branches: [main]
    paths:
      - 'data/source/**'
      - 'data/config/**'
      - 'src/build/**'
      - 'src/schema/**'
      # NOTE: sync-stock.js writes to data/source/products but we do NOT commit those changes
      # The build runs the sync in-memory, then builds. No git commit of synced files.
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual trigger'

env:
  NODE_VERSION: '20'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # NOTE: `npm run build` (below) already runs sync-stock then
      # sync-prices internally, in the correct order, as part of
      # build-all.js. A previous version of this workflow also ran them
      # here as a separate step before calling build — that meant every
      # build synced stock/prices to D1 twice per run (once here against
      # stale pre-build data, once inside build-all against the freshly
      # built products), burning double the D1 write-quota and Cloudflare
      # API calls for no benefit. Do not add a standalone sync step here;
      # let build-all.js own sync ordering.
      - name: Build catalog
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: npm run build

      # Stage the catalog output at the artifact root (not nested under
      # data/) before uploading. StoreClient (spa/lib/store-client.js)
      # fetches `{baseUrl}/index.json`, `{baseUrl}/products/*.json`,
      # `{baseUrl}/batches/*.json`, `{baseUrl}/config/*.json` directly off
      # the site root, so the deployed Pages artifact needs index.json,
      # products/, batches/, config/, and .version at its top level —
      # uploading `data/*` directly (as a previous version of this
      # workflow did) would nest everything one level too deep as
      # data/index.json, data/products/, etc.
      - name: Stage deploy payload
        run: |
          mkdir -p site
          cp data/index.json site/
          cp -r data/products site/
          cp -r data/batches site/
          cp -r data/config site/
          cp data/.version site/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: catalog-build
          path: site/
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # NOTE: this job intentionally does NOT check out the repo. A
      # previous version ran actions/checkout@v4 here, then downloaded the
      # build artifact into ./data, then ran `pages deploy .` — which
      # deploys the whole working directory, not just the built catalog.
      # That published src/, scripts/, package.json, wrangler.toml, and
      # raw data/source/ (pre-sale, pre-sync product data) to the public
      # Pages site alongside the intended index.json + products/ +
      # batches/ + config/ output. Deploy only the downloaded artifact,
      # which is already flattened to the site root (see "Stage deploy
      # payload" in the build job).
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: catalog-build
          path: ./deploy

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./deploy --project-name=your-store --branch=main

      - name: Purge CDN cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify on failure
        if: needs.deploy.result == 'failure'
        run: echo "::error::Build or deploy failed! Check logs above."
