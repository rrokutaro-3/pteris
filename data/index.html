<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Example Store</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f9f7;
      --surface: #ffffff;
      --border: #e5e5e0;
      --text: #1a1a1a;
      --muted: #767672;
      --accent: #1a1a1a;
      --accent-fg: #ffffff;
      --danger: #c0392b;
      --radius: 6px;
      --max: 900px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-weight: 700; font-size: 17px; letter-spacing: -0.3px; }
    .cart-btn {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius);
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cart-count {
      background: #e74c3c;
      color: #fff;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      display: none;
    }
    .cart-count.visible { display: inline; }

    /* ── Layout ── */
    main { max-width: var(--max); margin: 0 auto; padding: 32px 20px; }

    /* ── State screens ── */
    .state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .state h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Product grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .card-img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      background: #f0f0ec;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-body { padding: 14px; }
    .card-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .card-price { font-size: 14px; color: var(--muted); }
    .card-price .sale { color: var(--danger); font-weight: 600; margin-right: 6px; }
    .card-price .compare { text-decoration: line-through; }

    /* ── Product detail ── */
    #product-view { display: none; }
    .back-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-btn:hover { background: var(--bg); }
    .product-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }
    @media (max-width: 600px) {
      .product-layout { grid-template-columns: 1fr; }
    }
    .product-img {
      aspect-ratio: 3/4;
      background: #f0f0ec;
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 13px;
    }
    .product-img img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { display: flex; flex-direction: column; gap: 16px; }
    .product-name { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2; }
    .product-price { font-size: 20px; }
    .product-price .sale { color: var(--danger); font-weight: 600; margin-right: 8px; }
    .product-price .compare { text-decoration: line-through; color: var(--muted); font-size: 16px; }
    .product-desc { color: var(--muted); font-size: 14px; line-height: 1.6; }
    .product-desc p { margin-bottom: 8px; }
    .product-desc ul { padding-left: 18px; }

    /* Options */
    .option-group { display: flex; flex-direction: column; gap: 8px; }
    .option-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .option-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .opt-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .opt-btn:hover { border-color: var(--text); }
    .opt-btn.selected { border-color: var(--text); background: var(--text); color: #fff; }
    .opt-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Stock */
    .stock-info { font-size: 13px; }
    .in-stock { color: #27ae60; }
    .low-stock { color: #e67e22; }
    .out-stock { color: var(--danger); }

    /* Add to cart */
    .add-btn {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius);
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }
    .add-btn:hover { opacity: 0.85; }
    .add-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Cart drawer ── */
    .overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
    }
    .overlay.open { display: block; }
    .drawer {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(400px, 100vw);
      background: var(--surface);
      z-index: 201;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-header h2 { font-size: 16px; font-weight: 700; }
    .close-btn {
      background: none; border: none;
      font-size: 20px; cursor: pointer; color: var(--muted);
      line-height: 1;
    }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
    .cart-empty { text-align: center; padding: 60px 0; color: var(--muted); font-size: 14px; }
    .cart-item {
      display: flex; gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .cart-item-img {
      width: 64px; height: 80px;
      background: #f0f0ec;
      border-radius: 4px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .cart-item-variant { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .cart-item-price { font-size: 13px; font-weight: 600; }
    .qty-controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .qty-btn {
      width: 26px; height: 26px;
      border: 1px solid var(--border);
      background: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .qty-btn:hover { background: var(--bg); }
    .qty-val { font-size: 14px; font-weight: 600; min-width: 20px; text-align: center; }
    .remove-btn { color: var(--muted); font-size: 12px; cursor: pointer; background: none; border: none; margin-left: auto; }
    .drawer-footer {
      padding: 20px;
      border-top: 1px solid var(--border);
    }
    .subtotal {
      display: flex; justify-content: space-between;
      font-size: 15px; font-weight: 600;
      margin-bottom: 16px;
    }
    .checkout-btn {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius);
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .checkout-btn:hover { opacity: 0.85; }
    .checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Checkout form ── */
    #checkout-view { display: none; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } }
    .form-grid .full { grid-column: 1 / -1; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 13px; font-weight: 600; }
    .form-group input, .form-group select {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 14px;
      background: var(--surface);
      width: 100%;
    }
    .form-group input:focus, .form-group select:focus {
      outline: 2px solid var(--text);
      outline-offset: -1px;
    }
    .form-section-title {
      font-size: 16px; font-weight: 700;
      margin: 24px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .order-summary {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 24px;
    }
    .order-summary-item {
      display: flex; justify-content: space-between;
      font-size: 13px; padding: 4px 0;
    }
    .order-summary-item.total {
      font-weight: 700; font-size: 15px;
      border-top: 1px solid var(--border);
      margin-top: 8px; padding-top: 8px;
    }
    .submit-btn {
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: var(--radius);
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 24px;
    }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .error-msg {
      background: #fdecea;
      border: 1px solid #f5c6c2;
      color: var(--danger);
      border-radius: var(--radius);
      padding: 12px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .error-msg.visible { display: block; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: #fff;
      padding: 12px 20px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 500;
      transition: transform 0.3s ease;
      z-index: 300;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <div class="logo">Store</div>
  <button class="cart-btn" onclick="openCart()">
    Cart <span class="cart-count" id="cart-count">0</span>
  </button>
</header>

<!-- Overlay -->
<div class="overlay" id="overlay" onclick="closeCart()"></div>

<!-- Cart Drawer -->
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <h2>Your Cart</h2>
    <button class="close-btn" onclick="closeCart()">×</button>
  </div>
  <div class="drawer-body" id="cart-body">
    <div class="cart-empty">Your cart is empty.</div>
  </div>
  <div class="drawer-footer" id="cart-footer" style="display:none">
    <div class="subtotal">
      <span>Subtotal</span>
      <span id="cart-subtotal">$0.00</span>
    </div>
    <button class="checkout-btn" onclick="goToCheckout()">Checkout</button>
  </div>
</div>

<main>
  <!-- Product List -->
  <div id="list-view">
    <div class="state" id="loading-state">
      <div class="spinner"></div>
      <p>Loading products…</p>
    </div>
    <div class="state" id="error-state" style="display:none">
      <h2>Something went wrong</h2>
      <p id="error-msg-text">Could not load the store.</p>
    </div>
    <div class="grid" id="product-grid" style="display:none"></div>
  </div>

  <!-- Product Detail -->
  <div id="product-view">
    <button class="back-btn" onclick="showList()">← Back</button>
    <div class="product-layout">
      <div class="product-img" id="product-img">No image</div>
      <div class="product-info">
        <div class="product-name" id="product-name"></div>
        <div class="product-price" id="product-price"></div>
        <div class="product-desc" id="product-desc"></div>
        <div id="product-options"></div>
        <div class="stock-info" id="stock-info"></div>
        <button class="add-btn" id="add-btn" onclick="addToCart()">Add to Cart</button>
      </div>
    </div>
  </div>

  <!-- Checkout -->
  <div id="checkout-view">
    <button class="back-btn" onclick="showList(); openCart()">← Back to Cart</button>
    <h1 style="font-size:22px;font-weight:700;margin-bottom:24px">Checkout</h1>

    <div class="order-summary" id="checkout-summary"></div>

    <div class="form-section-title">Contact</div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Email</label>
        <input type="email" id="f-email" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>First name</label>
        <input type="text" id="f-fname" />
      </div>
      <div class="form-group">
        <label>Last name</label>
        <input type="text" id="f-lname" />
      </div>
    </div>

    <div class="form-section-title">Shipping Address</div>
    <div class="form-grid">
      <div class="form-group full">
        <label>Address</label>
        <input type="text" id="f-address1" placeholder="123 Main St" />
      </div>
      <div class="form-group full">
        <label>Apartment, suite, etc. (optional)</label>
        <input type="text" id="f-address2" />
      </div>
      <div class="form-group">
        <label>City</label>
        <input type="text" id="f-city" />
      </div>
      <div class="form-group">
        <label>State / Province</label>
        <input type="text" id="f-state" placeholder="CA" />
      </div>
      <div class="form-group">
        <label>ZIP / Postal code</label>
        <input type="text" id="f-zip" />
      </div>
      <div class="form-group">
        <label>Country</label>
        <select id="f-country">
          <option value="US">United States</option>
          <option value="GB">United Kingdom</option>
          <option value="CA">Canada</option>
          <option value="AU">Australia</option>
          <option value="DE">Germany</option>
          <option value="FR">France</option>
        </select>
      </div>
    </div>

    <div id="checkout-error" class="error-msg"></div>
    <button class="submit-btn" id="submit-btn" onclick="submitCheckout()">Pay with Stripe →</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="/store-config.js"></script>
<script type="module">
  // ── Config ──────────────────────────────────────────────
  // ── Config — update these to match your deployment ──────
  // STORE_URL: your Cloudflare Pages URL
  // API_URL:   your Worker URL + /api
  const STORE_URL   = window.__STORE_URL__ || window.location.origin;
  const API_URL     = window.__API_URL__   || 'https://lean-store-api.rrokutaro.workers.dev/api';
  // ────────────────────────────────────────────────────────

  import { StoreClient } from '/lib/store-client.js';

  const client = new StoreClient(STORE_URL, { apiUrl: API_URL });

  let allProducts = [];
  let currentProduct = null;
  let selectedOptions = {};
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');

  // ── Init ──
  async function init() {
    try {
      const index = await client.init();
      const ids = Object.keys(index.products || {});
      if (!ids.length) {
        showError('No products found.');
        return;
      }
      allProducts = await client.getProducts(ids);
      renderGrid();
    } catch (e) {
      showError(e.message);
    }
  }

  function showError(msg) {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('error-state').style.display = 'block';
    document.getElementById('error-msg-text').textContent = msg;
  }

  // ── Product Grid ──
  function renderGrid() {
    document.getElementById('loading-state').style.display = 'none';
    const grid = document.getElementById('product-grid');
    grid.style.display = 'grid';
    grid.innerHTML = allProducts.map(p => {
      const img = p.media?.images?.[0]?.url;
      const price = p.pricing?.price;
      const compare = p.pricing?.compareAtPrice;
      return `
        <div class="card" onclick="showProduct('${p.id}')">
          <div class="card-img">
            ${img ? `<img src="${img}" alt="${p.identity.name}" onerror="this.parentNode.textContent='No image'">` : 'No image'}
          </div>
          <div class="card-body">
            <div class="card-name">${p.identity.name}</div>
            <div class="card-price">
              ${compare ? `<span class="sale">$${price.toFixed(2)}</span><span class="compare">$${compare.toFixed(2)}</span>` : `$${price.toFixed(2)}`}
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ── Product Detail ──
  window.showProduct = async function(id) {
    currentProduct = allProducts.find(p => p.id === id);
    selectedOptions = {};
    if (!currentProduct) return;

    document.getElementById('list-view').style.display = 'none';
    document.getElementById('checkout-view').style.display = 'none';
    document.getElementById('product-view').style.display = 'block';

    const p = currentProduct;
    document.getElementById('product-name').textContent = p.identity.name;

    // Price
    const price = p.pricing.price;
    const compare = p.pricing.compareAtPrice;
    document.getElementById('product-price').innerHTML =
      compare
        ? `<span class="sale">$${price.toFixed(2)}</span><span class="compare">$${compare.toFixed(2)}</span>`
        : `$${price.toFixed(2)}`;

    // Image
    const imgEl = document.getElementById('product-img');
    const imgUrl = p.media?.images?.[0]?.url;
    imgEl.innerHTML = imgUrl
      ? `<img src="${imgUrl}" alt="${p.identity.name}" onerror="this.textContent='No image'">`
      : 'No image';

    // Description
    document.getElementById('product-desc').innerHTML =
      client.sanitizeHtml(p.description?.full || p.description?.short || '');

    // Variants / options
    renderOptions();
    updateAddButton();
  };

  function renderOptions() {
    const p = currentProduct;
    const container = document.getElementById('product-options');
    if (!p.variants?.length) { container.innerHTML = ''; return; }

    const { optionKeys } = client.buildVariantMatrix(p);
    const available = client.getAvailableOptions(p, selectedOptions);

    container.innerHTML = optionKeys.map(key => {
      const values = [...new Set(p.variants.map(v => v.options[key]))];
      return `
        <div class="option-group" style="margin-bottom:12px">
          <div class="option-label">${key}</div>
          <div class="option-buttons">
            ${values.map(val => {
              const isAvail = available[key]?.includes(val);
              const isSel = selectedOptions[key] === val;
              return `<button class="opt-btn ${isSel ? 'selected' : ''}" 
                ${!isAvail ? 'disabled' : ''}
                onclick="selectOption('${key}','${val}')">${val}</button>`;
            }).join('')}
          </div>
        </div>`;
    }).join('');
  }

  window.selectOption = function(key, val) {
    selectedOptions[key] = val;
    renderOptions();
    updateAddButton();
  };

  function getSelectedVariant() {
    const p = currentProduct;
    if (!p.variants?.length) return null;
    const { optionKeys } = client.buildVariantMatrix(p);
    const allSelected = optionKeys.every(k => selectedOptions[k]);
    if (!allSelected) return null;
    return p.variants.find(v => optionKeys.every(k => v.options[k] === selectedOptions[k])) || null;
  }

  function updateAddButton() {
    const p = currentProduct;
    const btn = document.getElementById('add-btn');
    const stockEl = document.getElementById('stock-info');
    const { optionKeys } = client.buildVariantMatrix(p);
    const allSelected = !optionKeys.length || optionKeys.every(k => selectedOptions[k]);
    const variant = getSelectedVariant();

    if (!allSelected) {
      btn.disabled = true;
      btn.textContent = 'Select options';
      stockEl.textContent = '';
      return;
    }
    const stock = variant ? variant.stock : (p.variants?.[0]?.stock ?? 99);
    const backorder = variant?.backorder;
    if (stock > 3) {
      stockEl.className = 'stock-info in-stock';
      stockEl.textContent = 'In stock';
    } else if (stock > 0) {
      stockEl.className = 'stock-info low-stock';
      stockEl.textContent = `Only ${stock} left`;
    } else if (backorder) {
      stockEl.className = 'stock-info low-stock';
      stockEl.textContent = 'Available on backorder';
    } else {
      stockEl.className = 'stock-info out-stock';
      stockEl.textContent = 'Out of stock';
      btn.disabled = true;
      btn.textContent = 'Out of Stock';
      return;
    }
    btn.disabled = false;
    btn.textContent = 'Add to Cart';
  }

  // ── Cart ──
  window.addToCart = function() {
    const p = currentProduct;
    const variant = getSelectedVariant() || p.variants?.[0];
    if (!variant && p.variants?.length) return;

    const variantLabel = variant
      ? Object.entries(variant.options).map(([k,v]) => `${k}: ${v}`).join(', ')
      : '';
    const imgUrl = variant?.image || p.media?.images?.[0]?.url;
    const price = variant?.price ?? p.pricing.price;
    const existing = cart.find(i => i.variantId === variant?.id && i.productId === p.id);

    if (existing) {
      existing.qty++;
    } else {
      cart.push({
        productId: p.id,
        variantId: variant?.id || p.id,
        name: p.identity.name,
        variantLabel,
        price,
        qty: 1,
        image: imgUrl
      });
    }
    saveCart();
    updateCartUI();
    showToast('Added to cart');
  };

  function saveCart() {
    localStorage.setItem('cart', JSON.stringify(cart));
  }

  function updateCartUI() {
    const total = cart.reduce((s, i) => s + i.qty, 0);
    const countEl = document.getElementById('cart-count');
    countEl.textContent = total;
    countEl.classList.toggle('visible', total > 0);

    const body = document.getElementById('cart-body');
    const footer = document.getElementById('cart-footer');

    if (!cart.length) {
      body.innerHTML = '<div class="cart-empty">Your cart is empty.</div>';
      footer.style.display = 'none';
      return;
    }

    footer.style.display = 'block';
    const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
    document.getElementById('cart-subtotal').textContent = `$${subtotal.toFixed(2)}`;

    body.innerHTML = cart.map((item, idx) => `
      <div class="cart-item">
        <div class="cart-item-img">
          ${item.image ? `<img src="${item.image}" onerror="this.style.display='none'">` : ''}
        </div>
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          ${item.variantLabel ? `<div class="cart-item-variant">${item.variantLabel}</div>` : ''}
          <div class="cart-item-price">$${(item.price * item.qty).toFixed(2)}</div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
            <span class="qty-val">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
            <button class="remove-btn" onclick="removeItem(${idx})">Remove</button>
          </div>
        </div>
      </div>`).join('');
  }

  window.changeQty = function(idx, delta) {
    cart[idx].qty += delta;
    if (cart[idx].qty < 1) cart.splice(idx, 1);
    saveCart(); updateCartUI();
  };
  window.removeItem = function(idx) {
    cart.splice(idx, 1);
    saveCart(); updateCartUI();
  };

  window.openCart = function() {
    document.getElementById('overlay').classList.add('open');
    document.getElementById('drawer').classList.add('open');
  };
  window.closeCart = function() {
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('drawer').classList.remove('open');
  };

  // ── Checkout ──
  window.goToCheckout = function() {
    closeCart();
    document.getElementById('list-view').style.display = 'none';
    document.getElementById('product-view').style.display = 'none';
    document.getElementById('checkout-view').style.display = 'block';

    const summary = document.getElementById('checkout-summary');
    const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
    summary.innerHTML = [
      ...cart.map(i => `
        <div class="order-summary-item">
          <span>${i.name}${i.variantLabel ? ` (${i.variantLabel})` : ''} × ${i.qty}</span>
          <span>$${(i.price * i.qty).toFixed(2)}</span>
        </div>`),
      `<div class="order-summary-item total"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>`
    ].join('');
  };

  window.showList = function() {
    document.getElementById('product-view').style.display = 'none';
    document.getElementById('checkout-view').style.display = 'none';
    document.getElementById('list-view').style.display = 'block';
  };

  window.submitCheckout = async function() {
    const btn = document.getElementById('submit-btn');
    const errEl = document.getElementById('checkout-error');
    errEl.classList.remove('visible');

    const email = document.getElementById('f-email').value.trim();
    const fname = document.getElementById('f-fname').value.trim();
    const lname = document.getElementById('f-lname').value.trim();
    const address1 = document.getElementById('f-address1').value.trim();
    const city = document.getElementById('f-city').value.trim();
    const state = document.getElementById('f-state').value.trim();
    const zip = document.getElementById('f-zip').value.trim();
    const country = document.getElementById('f-country').value;

    if (!email || !fname || !lname || !address1 || !city || !zip) {
      errEl.textContent = 'Please fill in all required fields.';
      errEl.classList.add('visible');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Redirecting to Stripe…';

    try {
      const cartPayload = cart.map(i => ({
        productId: i.productId,
        variantId: i.variantId,
        qty: i.qty,
        name: i.name,
        image: i.image || null
      }));

      const result = await client.createCheckout(
        cartPayload,
        { email, firstName: fname, lastName: lname },
        {
          firstName: fname, lastName: lname,
          address1, address2: document.getElementById('f-address2').value.trim(),
          city, state, zip, country
        }
      );

      if (result.checkoutUrl) {
        cart = [];
        saveCart();
        window.location.href = result.checkoutUrl;
      } else {
        throw new Error('No checkout URL returned.');
      }
    } catch (e) {
      errEl.textContent = e.message || 'Checkout failed. Please try again.';
      errEl.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Pay with Stripe →';
    }
  };

  // ── Toast ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── Boot ──
  updateCartUI();
  init();
</script>

</body>
</html>
